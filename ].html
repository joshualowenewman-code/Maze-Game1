<script>

  for (const [f, s, d] of lead) {                        // lead line (two slightly detuned squares)
    osc('square', f, t0 + s * b, d * b * 0.95, 0.1, 4500);
    osc('square', f * 1.005, t0 + s * b, d * b * 0.95, 0.06, 4500);
  }
  const tf = t0 + 7 * b;                                 // final hit
  kick(tf, 0.6); hit(tf, 0.5, 0.14, 'highpass', 6000);
  [220, 261.63, 329.63, 440].forEach(f => osc('sawtooth', f, tf, 0.55, 0.06, 3500));
  osc('sawtooth', 55, tf, 0.5, 0.3, 500); osc('sawtooth', 110, tf, 0.5, 0.2, 700);
  evilLaugh(tf + 0.6);                                   // ...and then the laugh
}

// Ganon-style evil laugh: low, gravelly "mwah-ha-ha-haaa" that sinks in pitch. t0 = start time (audio clock).
function evilLaugh(t0) {
  if (!ac) return;
  const out = ac.createGain(); out.gain.value = 0.9; out.connect(ac.destination);
  const nlen = Math.floor(ac.sampleRate * 0.1), nbuf = ac.createBuffer(1, nlen, ac.sampleRate), nd = nbuf.getChannelData(0);
  for (let i = 0; i < nlen; i++) nd[i] = Math.random() * 2 - 1;
  const ha = (t, f0, f1, dur, vol) => {
    const g = ac.createGain(), lp = ac.createBiquadFilter(), fm = ac.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 1500;
    fm.type = 'peaking'; fm.frequency.value = 750; fm.gain.value = 10; fm.Q.value = 2;     // throaty "aah"
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.03);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    lp.connect(fm); fm.connect(g); g.connect(out);
    for (const [type, mul, v] of [['sawtooth', 1, 0.5], ['square', 0.5, 0.35]]) {          // gravelly voice + deep sub
      const o = ac.createOscillator(), og = ac.createGain();
      o.type = type; o.frequency.setValueAtTime(f0 * mul, t); o.frequency.exponentialRampToValueAtTime(f1 * mul, t + dur);
      og.gain.value = v; o.connect(og); og.connect(lp); o.start(t); o.stop(t + dur + 0.02);
    }
    const sn = ac.createBufferSource(), bp = ac.createBiquadFilter(), sg = ac.createGain();  // breathy "h" up front
    sn.buffer = nbuf; bp.type = 'bandpass'; bp.frequency.value = 1100;
    sg.gain.setValueAtTime(vol * 0.25, t - 0.03); sg.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
    sn.connect(bp); bp.connect(sg); sg.connect(out); sn.start(t - 0.03); sn.stop(t + 0.06);
  };
  [[0, 190, 140, 0.26], [0.32, 150, 110, 0.12], [0.50, 130, 95, 0.12], [0.68, 115, 65, 0.30]]
    .forEach(([d, a, b, l]) => ha(t0 + d, a, b, l, 0.35));
}

function winMelody() {
  if (!ac) return;
  if (disco) { discoJingle(); return; }
  const song = [[196,.16],[165,.16],[131,.16],[165,.16],[196,.3],[196,.16],[110,.16],[131,.16],[147,.16],[165,.3],[98,.2],[104,.2],[98,.5]];
  let d = 0;
  for (const [f, len] of song) {
    tone('square', f, f * 0.96, len * 1.1, 0.14, d);
    tone('triangle', f * 2, f * 1.9, len * 1.1, 0.08, d);
    d += len;
  }
  evilLaugh(ac.currentTime + d + 0.08);                  // ...and then the laugh
}
function showScare() {
  scaring = true; scareSound();
  const el = document.getElementById('scare'), im = el.firstElementChild;
  el.style.display = 'block';
  const scareMs = disco ? 3200 : 2600;   // how long the bouncing scare lasts (longer for the disco jingle + laugh)
  // much bigger image, sized to the screen
  const size = Math.min(Math.max(260, Math.min(W, H) * 0.7), W, H);
  const ratio = im.naturalWidth ? im.naturalHeight / im.naturalWidth : 220 / 226;
  const w = size, h = size * ratio;
  im.style.width = w + 'px';
  let x = (W - w) / 2, y = (H - h) / 2;
  const sp = Math.max(W, H) * 0.9;                       // pixels per second
  let vx = (Math.random() < 0.5 ? -1 : 1) * sp, vy = (Math.random() < 0.5 ? -1 : 1) * sp * 0.7;
  const t0 = performance.now(); let last = t0;
  im.style.left = x + 'px'; im.style.top = y + 'px';
  (function tick(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    x += vx * dt; y += vy * dt;
    if (x < 0) { x = 0; vx = Math.abs(vx); } else if (x > W - w) { x = Math.max(0, W - w); vx = -Math.abs(vx); }
    if (y < 0) { y = 0; vy = Math.abs(vy); } else if (y > H - h) { y = Math.max(0, H - h); vy = -Math.abs(vy); }
    im.style.left = x + 'px'; im.style.top = y + 'px';
    if (now - t0 < scareMs) requestAnimationFrame(tick);
    else { el.style.display = 'none'; scaring = false; level = 1; newLevel(); }
  })(t0);
}
let shake = 0, winT = 0, shakeDir = [0, 0];

function newColors() {
  const h = Math.random() * 360;
  const l = 38 + Math.random() * 24;
  bgL = l;
  bg = `hsl(${h},75%,${l}%)`;
  fg = `hsl(${(h + 180) % 360},90%,${l > 50 ? 30 : 62}%)`;
}

function layout() {
  dpr = window.devicePixelRatio || 1;
  W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function newLevel() {
  layout();
  cell = Math.max(20, 44 - (level - 1) * 3);
  cols = Math.floor(W / cell); rows = Math.floor(H / cell);
  if (cols % 2 === 0) cols--; if (rows % 2 === 0) rows--;
  cols = Math.max(cols, 5); rows = Math.max(rows, 5);
  ox = (W - cols * cell) / 2; oy = (H - rows * cell) / 2;
  // true = wall
  maze = Array.from({ length: rows }, () => Array(cols).fill(true));
  const stack = [[1, 1]]; maze[1][1] = false;
  const dirs = [[2, 0], [-2, 0], [0, 2], [0, -2]];
  while (stack.length) {
    const [x, y] = stack[stack.length - 1];
    const opts = dirs.filter(([dx, dy]) => {
      const nx = x + dx, ny = y + dy;
      return nx > 0 && ny > 0 && nx < cols - 1 && ny < rows - 1 && maze[ny][nx];
    });
    if (!opts.length) { stack.pop(); continue; }
    const [dx, dy] = opts[Math.floor(Math.random() * opts.length)];
    maze[y + dy / 2][x + dx / 2] = false;
    maze[y + dy][x + dx] = false;
    stack.push([x + dx, y + dy]);
  }
  // knock out a few walls so there are loops
  const extra = Math.floor(cols * rows * 0.02);
  for (let i = 0; i < extra; i++) {
    const x = 1 + Math.floor(Math.random() * (cols - 2));
    const y = 1 + Math.floor(Math.random() * (rows - 2));
    maze[y][x] = false;
  }
  px = 1; py = 1; bumpLatch = false; winT = 0; reveal = false;
  newColors();
}

// ---- movement: smooth, hold-to-move, instant direction changes ----
const SPEED = 7;   // cells per second (raise for faster, lower for slower)
const HB = 0.3;    // player hitbox half-size in cells (smaller = more forgiving corners)
const DIRS = { L: [-1, 0], R: [1, 0], U: [0, -1], D: [0, 1] };
const KEYMAP = { ArrowLeft: 'L', ArrowRight: 'R', ArrowUp: 'U', ArrowDown: 'D',
  a: 'L', d: 'R', w: 'U', s: 'D', A: 'L', D: 'R', W: 'U', S: 'D' };
let held = [], touchDir = null, touchPrev = null, touchPrevT = 0, bumpLatch = false, lastT = null;

function isWall(x, y) { return x < 0 || y < 0 || x >= cols || y >= rows || maze[y][x]; }
function hit(fx, fy) {
  const x0 = Math.floor(fx - HB + 0.5), x1 = Math.floor(fx + HB + 0.5);
  const y0 = Math.floor(fy - HB + 0.5), y1 = Math.floor(fy + HB + 0.5);
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) if (isWall(x, y)) return true;
  return false;
}
// Is the way open in this direction (measured from the nearest lane centre)?
// With edge=true it also counts the last sliver of room before we touch the wall.
function canProgress(k, edge) {
  const [dx, dy] = DIRS[k], s = dx || dy;
  const along = dx ? px : py, perp = dx ? py : px;
  const r = Math.round(along), lane = Math.round(perp);
  const ahead = dx ? isWall(r + s, lane) : isWall(lane, r + s);
  return !ahead || (edge && s * (along - r) < 0.5 - HB - 0.03);
}
// newest input first; older still-held keys act as fallbacks (so a turn can be "queued")
function wantedDirs() {
  const list = [];
  if (touchDir) list.push(touchDir);
  if (touchPrev && touchPrev !== touchDir && performance.now() - touchPrevT < 350) list.push(touchPrev);
  for (let i = held.length - 1; i >= 0; i--) list.push(held[i]);
  return list;
}
function bump(k) {
  bumpLatch = true; shake = 1; shakeDir = DIRS[k]; bumpSound();
}
function stepMove(k, dist) {
  const [dx, dy] = DIRS[k];
  let moved = 0;
  // glide toward the centre of the lane so turns line up with openings
  if (dx) { const d = Math.max(-dist, Math.min(dist, Math.round(py) - py)); if (d && !hit(px, py + d)) { py += d; moved += Math.abs(d); } }
  else    { const d = Math.max(-dist, Math.min(dist, Math.round(px) - px)); if (d && !hit(px + d, py)) { px += d; moved += Math.abs(d); } }
  const n = Math.ceil(dist / 0.05), sub = dist / n;
  for (let i = 0; i < n; i++) {
    const nx = px + dx * sub, ny = py + dy * sub;
    if (hit(nx, ny)) break;
    px = nx; py = ny; moved += sub;
  }
  return moved;
}
function update(dt) {
  if (winT) return;
  const want = wantedDirs();
  if (!want.length) { bumpLatch = false; return; }
  let moved = 0;
  for (const k of want) {                       // newest input first, older held keys as fallbacks
    if (!canProgress(k, false)) continue;
    moved = stepMove(k, SPEED * dt);
    if (moved > 1e-6) break;
  }
  if (moved < 1e-6 && canProgress(want[0], true)) moved = stepMove(want[0], SPEED * dt);   // slide up to the wall
  if (moved < 1e-6) { if (!bumpLatch) bump(want[0]); return; }   // everything is blocked: bump once
  bumpLatch = false;
  if (Math.abs(px - (cols - 2)) < 0.5 && Math.abs(py - (rows - 2)) < 0.5) {
    winT = performance.now(); completed++; winMelody();
  }
}

addEventListener('keydown', e => {
  const k = KEYMAP[e.key];
  if (k) {
    e.preventDefault(); unlock(); oneCount = 0;
    if (e.repeat) return;
    held = held.filter(x => x !== k); held.push(k);
    if (!winT && !canProgress(k, false)) bump(k);
  } else if (e.key === '2') {
    unlock(); oneCount = 0;
    if (!e.repeat) playerHue = ((playerHue === null ? Math.random() * 360 : playerHue) + 60 + Math.random() * 240) % 360;
  } else if (e.key === '3') {
    unlock(); oneCount = 0;
    if (!e.repeat) {
      disco = !disco;                                    // little sound so you can tell which one is on
      if (disco) { tone('square', 659, 659, 0.08, 0.12); tone('square', 988, 988, 0.12, 0.12, 0.09); }
      else { tone('square', 659, 659, 0.08, 0.12); tone('square', 440, 440, 0.12, 0.12, 0.09); }
    }
  } else if (e.key === '1') {
    unlock(); const n = performance.now();
    oneCount = n - oneLast > 1500 ? 1 : oneCount + 1; oneLast = n;
    if (oneCount >= 5) { oneCount = 0; reveal = !reveal; }
  } else oneCount = 0;
});
addEventListener('keyup', e => { const k = KEYMAP[e.key]; if (k) held = held.filter(x => x !== k); });
addEventListener('blur', () => { held = []; touchDir = null; touchPrev = null; });

// touch: keep your finger down and drag. The anchor trails the finger, so changing direction only takes a small nudge.
let anchor = null;
function setTouchDir(k) {
  if (k === touchDir) return;
  touchPrev = touchDir; touchPrevT = performance.now(); touchDir = k;
  if (!winT && !canProgress(k, false)) bump(k);
}
addEventListener('touchstart', e => { unlock(); const t = e.touches[0]; anchor = { x: t.clientX, y: t.clientY }; }, { passive: true });
addEventListener('touchmove', e => {
  if (!anchor) return;
  const t = e.touches[0], R = 18;
  anchor.x = Math.max(t.clientX - R, Math.min(t.clientX + R, anchor.x));
  anchor.y = Math.max(t.clientY - R, Math.min(t.clientY + R, anchor.y));
  const dx = t.clientX - anchor.x, dy = t.clientY - anchor.y;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 8) return;
  setTouchDir(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'R' : 'L') : (dy > 0 ? 'D' : 'U'));
}, { passive: true });
const endTouch = () => { anchor = null; touchDir = null; touchPrev = null; };
addEventListener('touchend', endTouch, { passive: true });
addEventListener('touchcancel', endTouch, { passive: true });

let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(newLevel, 200); });

function draw(now) {
  const dt = lastT === null ? 0 : Math.min(0.05, (now - lastT) / 1000); lastT = now; update(dt);
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  let sx = 0, sy = 0;
  if (shake > 0) { sx = shakeDir[0] * shake * 4; sy = shakeDir[1] * shake * 4; shake -= 0.15; }
  let scale = 1;
  if (winT) {
    const p = (now - winT) / 1900;
    scale = 1 + p * p * 14;
    if (p >= 1 && !scaring) showScare();
  }
  if (reveal) {
    ctx.fillStyle = 'rgba(0,0,0,0.38)';
    for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++)
      if (maze[y][x]) ctx.fillRect(ox + x * cell, oy + y * cell, cell, cell);
    ctx.fillStyle = fg; ctx.globalAlpha = 0.45;
    ctx.fillRect(ox + (cols - 2) * cell, oy + (rows - 2) * cell, cell, cell);
    ctx.globalAlpha = 1;
  }
  const s = cell * scale, cx = ox + px * cell + cell / 2 + sx, cy = oy + py * cell + cell / 2 + sy;
  ctx.fillStyle = playerHue === null ? fg : `hsl(${playerHue},95%,${bgL > 50 ? 22 : 78}%)`;
  ctx.fillRect(cx - s / 2, cy - s / 2, s, s);
  ctx.save();
  ctx.font = 'bold 20px system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.lineWidth = 4; ctx.lineJoin = 'round'; ctx.strokeStyle = bg; ctx.fillStyle = fg;
  const label = 'Mazes completed: ' + completed;
  ctx.strokeText(label, W / 2, 14); ctx.fillText(label, W / 2, 14);
  ctx.restore();
  requestAnimationFrame(draw);
}

newLevel();
requestAnimationFrame(draw);
</script>
</body>
